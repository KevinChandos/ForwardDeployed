AWSTemplateFormatVersion: "2010-09-09"
Description: >
  BookWorm API — AWS Secrets Manager Secrets.
  Creates all runtime secrets consumed by the Spring Boot application via the
  spring-cloud-aws-secrets-manager integration.  Secrets are encrypted with a
  customer-managed KMS key (bookworm-prod-secrets-cmk).
  Rotation is configured for database credentials; JWT/payment/mail secrets
  require manual rotation (no auto-rotation Lambda deployed here).

# ──────────────────────────────────────────────────────────────────────────────
# Parameters
# ──────────────────────────────────────────────────────────────────────────────
Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment.

  KmsKeyArn:
    Type: String
    Description: >
      ARN of the customer-managed KMS key used to encrypt all secrets.
      Creating the key itself is out of scope for this template; provision it
      separately and paste the ARN here.  The key must grant the Secrets
      Manager service principal kms:GenerateDataKey and kms:Decrypt.

  # ── DB Primary secret initial values ────────────────────────────────────────
  DBPrimaryHost:
    Type: String
    Description: >
      Primary RDS endpoint (imported from rds stack output or passed directly).
      Example: bookworm-prod-primary.xxxxxx.ap-southeast-2.rds.amazonaws.com

  DBPrimaryUsername:
    Type: String
    Default: bookworm_admin
    Description: PostgreSQL master username for the primary instance.

  DBPrimaryPassword:
    Type: String
    NoEcho: true
    Description: >
      Initial master password for the primary DB.  Once rotation is enabled the
      Lambda rotator will manage subsequent values — this initial value is only
      written at stack creation time.
    MinLength: 16

  # ── DB Replica secret initial values ────────────────────────────────────────
  DBReplicaHost:
    Type: String
    Description: >
      Read-replica RDS endpoint.
      Leave blank when CreateReadReplica=false in the rds stack.
    Default: ""

  DBReplicaUsername:
    Type: String
    Default: bookworm_reader
    Description: PostgreSQL username for read-only replica access.

  DBReplicaPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: Initial password for the replica DB user.

  # ── JWT secret ───────────────────────────────────────────────────────────────
  JWTSecret:
    Type: String
    NoEcho: true
    Description: >
      Minimum 256-bit (32-byte) random string used to sign JWT tokens.
      Generate with: openssl rand -base64 32
    MinLength: 32

  JWTAccessTokenTTLSeconds:
    Type: Number
    Default: 900       # 15 minutes
    Description: Access token TTL in seconds.

  JWTRefreshTokenTTLSeconds:
    Type: Number
    Default: 604800    # 7 days
    Description: Refresh token TTL in seconds.

  # ── Payment secret ──────────────────────────────────────────────────────────
  PaymentApiKey:
    Type: String
    NoEcho: true
    Default: "REPLACE_ME"
    Description: Payment gateway API key.

  PaymentWebhookSecret:
    Type: String
    NoEcho: true
    Default: "REPLACE_ME"
    Description: Webhook signing secret from the payment provider.

  PaymentHmacKey:
    Type: String
    NoEcho: true
    Default: "REPLACE_ME"
    Description: HMAC-SHA256 key for payment webhook signature validation.

  # ── Mail secret ─────────────────────────────────────────────────────────────
  SmtpHost:
    Type: String
    Default: "smtp.example.com"
    Description: SMTP relay hostname.

  SmtpPort:
    Type: Number
    Default: 587
    Description: SMTP port (587 for STARTTLS, 465 for SMTPS).

  SmtpUsername:
    Type: String
    Default: "noreply@example.com"
    Description: SMTP authentication username.

  SmtpPassword:
    Type: String
    NoEcho: true
    Default: "REPLACE_ME"
    Description: SMTP authentication password.

  # ── Rotation ─────────────────────────────────────────────────────────────────
  DBRotationLambdaArn:
    Type: String
    Default: ""
    Description: >
      ARN of the Secrets Manager Lambda rotation function for RDS PostgreSQL.
      Leave blank to skip automatic rotation configuration.
      Provision the AWS-managed rotator lambda separately and supply its ARN.

# ──────────────────────────────────────────────────────────────────────────────
# Conditions
# ──────────────────────────────────────────────────────────────────────────────
Conditions:
  HasReplicaHost: !Not [!Equals [!Ref DBReplicaHost, ""]]
  HasRotationLambda: !Not [!Equals [!Ref DBRotationLambdaArn, ""]]

# ──────────────────────────────────────────────────────────────────────────────
# Resources
# ──────────────────────────────────────────────────────────────────────────────
Resources:

  # ---------------------------------------------------------------------------
  # Secret: DB Primary credentials
  # JSON structure matches the RDS Secrets Manager rotation lambda's expected
  # schema so that the Lambda rotator can update the password without changes.
  # ---------------------------------------------------------------------------
  SecretDBPrimary:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain   # Never auto-delete database credentials
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "bookworm/${Environment}/db/primary"
      Description: !Sub "BookWorm ${Environment} — primary RDS PostgreSQL credentials"
      KmsKeyId: !Ref KmsKeyArn
      SecretString: !Sub |
        {
          "username": "${DBPrimaryUsername}",
          "password": "${DBPrimaryPassword}",
          "host": "${DBPrimaryHost}",
          "port": "5432",
          "dbname": "bookworm",
          "engine": "postgres"
        }
      Tags:
        - Key: Application
          Value: bookworm-api
        - Key: Environment
          Value: !Ref Environment
        - Key: SecretType
          Value: database
        - Key: ManagedBy
          Value: CloudFormation

  # Attach auto-rotation to the primary secret when a rotation lambda is provided.
  # The Lambda uses a dual-user strategy so in-flight requests are never broken.
  SecretDBPrimaryRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    Condition: HasRotationLambda
    DependsOn: SecretDBPrimary
    Properties:
      SecretId: !Ref SecretDBPrimary
      RotationLambdaARN: !Ref DBRotationLambdaArn
      RotationRules:
        AutomaticallyAfterDays: 30
      RotateImmediatelyOnUpdate: false   # Prevent disruption on CFN updates

  # ---------------------------------------------------------------------------
  # Secret: DB Replica credentials
  # ---------------------------------------------------------------------------
  SecretDBReplica:
    Type: AWS::SecretsManager::Secret
    Condition: HasReplicaHost
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "bookworm/${Environment}/db/replica"
      Description: !Sub "BookWorm ${Environment} — read-replica RDS credentials"
      KmsKeyId: !Ref KmsKeyArn
      SecretString: !Sub |
        {
          "username": "${DBReplicaUsername}",
          "password": "${DBReplicaPassword}",
          "host": "${DBReplicaHost}",
          "port": "5432",
          "dbname": "bookworm",
          "engine": "postgres"
        }
      Tags:
        - Key: Application
          Value: bookworm-api
        - Key: Environment
          Value: !Ref Environment
        - Key: SecretType
          Value: database
        - Key: Role
          Value: read-replica
        - Key: ManagedBy
          Value: CloudFormation

  SecretDBReplicaRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    Condition: HasRotationLambda
    DependsOn: SecretDBReplica
    Properties:
      SecretId: !Ref SecretDBReplica
      RotationLambdaARN: !Ref DBRotationLambdaArn
      RotationRules:
        AutomaticallyAfterDays: 30
      RotateImmediatelyOnUpdate: false

  # ---------------------------------------------------------------------------
  # Secret: JWT signing configuration
  # Manual rotation only — update here or via CLI, then redeploy App Runner.
  # ---------------------------------------------------------------------------
  SecretJWT:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "bookworm/${Environment}/jwt"
      Description: !Sub "BookWorm ${Environment} — JWT signing secret and TTL configuration"
      KmsKeyId: !Ref KmsKeyArn
      SecretString: !Sub |
        {
          "secret": "${JWTSecret}",
          "access-token-ttl-seconds": "${JWTAccessTokenTTLSeconds}",
          "refresh-token-ttl-seconds": "${JWTRefreshTokenTTLSeconds}"
        }
      Tags:
        - Key: Application
          Value: bookworm-api
        - Key: Environment
          Value: !Ref Environment
        - Key: SecretType
          Value: jwt
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # Secret: Payment gateway credentials
  # ---------------------------------------------------------------------------
  SecretPayment:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "bookworm/${Environment}/payment"
      Description: !Sub "BookWorm ${Environment} — payment gateway API and webhook credentials"
      KmsKeyId: !Ref KmsKeyArn
      SecretString: !Sub |
        {
          "api-key": "${PaymentApiKey}",
          "webhook-secret": "${PaymentWebhookSecret}",
          "hmac-key": "${PaymentHmacKey}"
        }
      Tags:
        - Key: Application
          Value: bookworm-api
        - Key: Environment
          Value: !Ref Environment
        - Key: SecretType
          Value: payment
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # Secret: Mail / SMTP credentials
  # ---------------------------------------------------------------------------
  SecretMail:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "bookworm/${Environment}/mail"
      Description: !Sub "BookWorm ${Environment} — SMTP relay credentials"
      KmsKeyId: !Ref KmsKeyArn
      SecretString: !Sub |
        {
          "smtp-host": "${SmtpHost}",
          "smtp-port": "${SmtpPort}",
          "smtp-username": "${SmtpUsername}",
          "smtp-password": "${SmtpPassword}"
        }
      Tags:
        - Key: Application
          Value: bookworm-api
        - Key: Environment
          Value: !Ref Environment
        - Key: SecretType
          Value: mail
        - Key: ManagedBy
          Value: CloudFormation

# ──────────────────────────────────────────────────────────────────────────────
# Outputs  (ARNs exported for App Runner IAM policy and env-var injection)
# ──────────────────────────────────────────────────────────────────────────────
Outputs:
  SecretDBPrimaryArn:
    Description: ARN of the primary DB credentials secret
    Value: !Ref SecretDBPrimary
    Export:
      Name: !Sub "${AWS::StackName}-SecretDBPrimaryArn"

  SecretDBReplicaArn:
    Condition: HasReplicaHost
    Description: ARN of the read-replica DB credentials secret
    Value: !Ref SecretDBReplica
    Export:
      Name: !Sub "${AWS::StackName}-SecretDBReplicaArn"

  SecretJWTArn:
    Description: ARN of the JWT signing secret
    Value: !Ref SecretJWT
    Export:
      Name: !Sub "${AWS::StackName}-SecretJWTArn"

  SecretPaymentArn:
    Description: ARN of the payment gateway secret
    Value: !Ref SecretPayment
    Export:
      Name: !Sub "${AWS::StackName}-SecretPaymentArn"

  SecretMailArn:
    Description: ARN of the SMTP mail secret
    Value: !Ref SecretMail
    Export:
      Name: !Sub "${AWS::StackName}-SecretMailArn"
