# ============================================================
# rollback.yml
# Purpose: Manual rollback workflow for production and staging.
# Triggered manually via workflow_dispatch only — never automatic.
# Strategy: re-tag a known-good ECR image and re-deploy it to
#           App Runner, bypassing the full CI pipeline.
# Side effect: Overwrites the running App Runner revision with
#              a prior image. Current :stable tag is preserved
#              unless --promote-rollback is specified.
# ============================================================
name: "Rollback — Manual"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to roll back"
        required: true
        type: choice
        options:
          - production
          - staging
      rollback_target:
        description: "ECR image tag to roll back to (e.g. abc1234-prod). Leave blank to use :stable (production) or :latest-staging (staging)."
        required: false
        default: ""
      reason:
        description: "Reason for rollback (required for audit trail)"
        required: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  rollback:
    name: "Rollback — ${{ github.event.inputs.environment }}"
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Validate rollback request
        run: |
          echo "===================================================="
          echo "  ROLLBACK REQUEST"
          echo "  Initiated by : ${{ github.actor }}"
          echo "  Environment  : ${{ github.event.inputs.environment }}"
          echo "  Target tag   : ${{ github.event.inputs.rollback_target || '(default)' }}"
          echo "  Reason       : ${{ github.event.inputs.reason }}"
          echo "  Timestamp    : $(date -u)"
          echo "===================================================="

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve rollback image tag
        id: resolve
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          INPUT_TAG: ${{ github.event.inputs.rollback_target }}
          ENV_NAME: ${{ github.event.inputs.environment }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TARGET_TAG="$INPUT_TAG"
          elif [ "$ENV_NAME" = "production" ]; then
            TARGET_TAG="stable"
          else
            TARGET_TAG="latest-staging"
          fi

          # Verify the image exists before attempting rollback
          EXISTS=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TARGET_TAG" \
            --query 'imageDetails[0].imageTags' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          if [ "$EXISTS" = "NOT_FOUND" ]; then
            echo "ERROR: Image tag '${TARGET_TAG}' not found in ECR. Aborting."
            exit 1
          fi

          echo "target_tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${ECR_REGISTRY}/${ECR_REPOSITORY}:${TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved rollback target: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${TARGET_TAG}"

      - name: Update App Runner image configuration
        env:
          TARGET_TAG: ${{ steps.resolve.outputs.target_tag }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Determine service ARN based on environment
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            SERVICE_ARN="${{ vars.APP_RUNNER_SERVICE_ARN_PROD }}"
          else
            SERVICE_ARN="${{ vars.APP_RUNNER_SERVICE_ARN_STAGING }}"
          fi

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${TARGET_TAG}"

          # Update the App Runner service with the rollback image
          aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --source-configuration "{
              \"ImageRepository\": {
                \"ImageIdentifier\": \"${IMAGE_URI}\",
                \"ImageRepositoryType\": \"ECR\"
              }
            }"

          echo "App Runner service updated to image: ${IMAGE_URI}"

      - name: Wait for App Runner service rollback to complete
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            SERVICE_ARN="${{ vars.APP_RUNNER_SERVICE_ARN_PROD }}"
          else
            SERVICE_ARN="${{ vars.APP_RUNNER_SERVICE_ARN_STAGING }}"
          fi

          for i in $(seq 1 30); do
            STATUS=$(aws apprunner describe-service \
              --service-arn "$SERVICE_ARN" \
              --query 'Service.Status' \
              --output text)
            echo "  Attempt ${i}/30 — Status: ${STATUS}"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "Rollback completed — service is RUNNING."
              exit 0
            elif [ "$STATUS" = "OPERATION_IN_PROGRESS" ]; then
              sleep 20
            else
              echo "Unexpected status '${STATUS}' during rollback."
              exit 1
            fi
          done
          echo "Timeout waiting for rollback to complete."
          exit 1
