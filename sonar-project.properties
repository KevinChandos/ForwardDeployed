# ============================================================
# sonar-project.properties
# Purpose: SonarCloud project configuration.
# Usage: Read automatically by the Maven Sonar plugin during
#        `mvn sonar:sonar` execution in the pipeline.
# Side effect: Changing sonar.sources or exclusions affects
#              what code is included in the quality gate.
# ============================================================

# Project identification
sonar.projectKey=my-org_my-app
sonar.projectName=My Application
sonar.projectVersion=1.0

# Source & test directories
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Coverage report path (generated by JaCoCo via Maven)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions — generated code, configs, and infrastructure files
sonar.exclusions=\
  **/generated/**,\
  **/dto/**/*MapperImpl.java,\
  **/config/**,\
  **/*Application.java

# Test exclusions
sonar.test.exclusions=\
  **/test/resources/**

# Quality gate — use the project-specific gate rather than the default
# (configured in SonarCloud project settings)
sonar.qualitygate.wait=true
