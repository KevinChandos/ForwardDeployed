spring:
  application:
    name: bookworm-api-test

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    jwt:
      secret: "CHANGE_ME_IN_PRODUCTION_USE_256_BIT_KEY_FOR_TESTS_1234567890"
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800

server:
  servlet:
    context-path: /v1
