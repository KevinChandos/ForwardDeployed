spring:
  application:
    name: bookworm-api

  datasource:
    url: jdbc:postgresql://localhost:5432/bookworm
    username: bookworm
    password: bookworm
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate           # Flyway owns schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Enable Hibernate 6 UUID handling via standard JDBC UUID type
        jdbc:
          time_zone: UTC
        default_schema: public     # Entities use schema-qualified table names

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    # JWT configuration (override per environment)
    jwt:
      secret: "CHANGE_ME_IN_PRODUCTION_USE_256_BIT_KEY"
      access-token-ttl-seconds: 900      # 15 minutes
      refresh-token-ttl-seconds: 604800  # 7 days

server:
  port: 8080
  servlet:
    context-path: /v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    io.bookworm: INFO
    org.hibernate.SQL: WARN
