  # ══════════════════════════════════════════════════════════════════════════
  # Payments
  # ══════════════════════════════════════════════════════════════════════════

  /payments/initiate:
    post:
      tags: [Payments]
      summary: Initiate payment for a confirmed order
      operationId: initiatePayment
      description: |
        Initiates a payment transaction for a previously confirmed checkout order.

        **⚠ Fraud & KYC risk — GuestToken callers:**
        Allowing unauthenticated guest sessions to initiate real payment
        transactions (credit card, debit card, UPI) carries significant fraud,
        chargeback, and KYC/AML compliance risks because there is no verified
        identity anchor.  The `GuestToken` option is retained here for
        wallet-funded guest checkouts only pending a platform policy decision.
        All integrations SHOULD prefer authenticated (`BearerAuth`) flows.
        A future governance review (SEC-02) is scheduled to remove `GuestToken`
        from this operation once guest identity capture is mandatory.
      security:
        - BearerAuth: []
        - GuestToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiatePaymentRequest'
      responses:
        '201':
          description: Payment initiated; returns gateway payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInitiatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /payments/{transactionId}/confirm:
    parameters:
      - name: transactionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    post:
      tags: [Payments]
      summary: Confirm payment after client-side gateway interaction
      operationId: confirmPayment
      description: |
        Submits the gateway-provided payment result (payment ID + signature)
        back to the platform for server-side verification and order fulfilment.

        **⚠ Fraud & KYC risk — GuestToken callers:**
        Confirming a real payment without an authenticated member identity
        means chargebacks and refund disputes cannot be linked to a verified
        user.  `GuestToken` is tolerated here only because the transaction was
        already initiated under the same token.  All integrations SHOULD prefer
        authenticated (`BearerAuth`) flows.  Tracked under governance finding
        SEC-03 for removal once guest identity capture is mandatory.
      security:
        - BearerAuth: []
        - GuestToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
      responses:
        '200':
          description: Payment confirmed or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /payments/{transactionId}:
    parameters:
      - name: transactionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    get:
      tags: [Payments]
      summary: Get payment transaction status
      operationId: getPayment
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Payment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/webhook:
    post:
      tags: [Payments]
      summary: Receive gateway webhook callbacks
      operationId: paymentWebhook
      description: |
        Public endpoint — validates the `X-Gateway-Signature` HMAC-SHA256 header.
        Processes gateway-initiated payment and refund status updates.
      parameters:
        - name: X-Gateway-Signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature from the payment gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Gateway-specific webhook payload
      responses:
        '200':
          description: Webhook processed
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

