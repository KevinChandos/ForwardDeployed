  # ══════════════════════════════════════════════════════════════════════════

  /categories:
    get:
      tags: [Categories]
      summary: Get full category tree
      operationId: listCategories
      responses:
        '200':
          description: Category tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryTreeResponse'
    post:
      tags: [Categories]
      summary: Create a category (admin)
      operationId: createCategory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryNodeDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # DESIGN-01 fix: the former /categories/{slug} and /categories/{categoryId}
  # used two overlapping {variable} templates, causing spec-breaking router
  # ambiguity.  Slug lookup is now a dedicated sub-path; the UUID path item is
  # consolidated to hold GET + PUT + DELETE for a single resource.
  /categories/by-slug/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9-]+$'
          description: URL-safe slug for the category (e.g. "science-fiction")
    get:
      tags: [Categories]
      summary: Get category by slug
      operationId: getCategoryBySlug
      # Public — browse by slug does not require a session.
      security: []
      responses:
        '200':
          description: Category node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryNodeDTO'
        '404':
          $ref: '#/components/responses/NotFound'

  /categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    get:
      tags: [Categories]
      summary: Get category by ID
      operationId: getCategory
      # Public — browsing by UUID does not require a session.
      security: []
      responses:
        '200':
          description: Category node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryNodeDTO'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Categories]
      summary: Update a category (admin)
      operationId: updateCategory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryNodeDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Categories]
      summary: Delete a category (admin)
      operationId: deleteCategory
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Category deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ══════════════════════════════════════════════════════════════════════════
  # Books
  # ══════════════════════════════════════════════════════════════════════════

  /books:
    get:
      tags: [Books]
      summary: Browse and filter books
      operationId: listBooks
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: authorId
          in: query
          schema:
            $ref: '#/components/schemas/UUID'
        - name: publisherId
          in: query
          schema:
            $ref: '#/components/schemas/UUID'
        - name: language
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [PAPERBACK, HARDCOVER, EBOOK]
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: isActive
          in: query
          schema:
            type: boolean
            default: true
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, 'price:asc', 'price:desc', 'sales:desc', 'rating:desc', 'publishedDate:desc']
            default: relevance
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated book list
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookSummaryDTO'
                  pagination:
                    $ref: '#/components/schemas/PaginationDTO'
    post:
      tags: [Books]
      summary: Create a book listing (admin)
      operationId: createBook
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /books/{bookId}:
    parameters:
      - name: bookId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    get:
      tags: [Books]
      summary: Get full book detail (PDP)
      operationId: getBook
      # NEW-01 fix: BearerAuth is listed first so that authenticated callers
      # receive the isInWishlist field.  The empty-object alternative ({}) means
      # no credentials are required, allowing unauthenticated guest PDP access.
      # The global GuestToken default is intentionally NOT used here — guests
      # browsing the catalogue do not need a session token at all.
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Book detail
          content:
