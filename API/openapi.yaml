    get:
      tags: [Reviews]
      summary: Get my review for a book
      operationId: getMyReview
      security:
        - BearerAuth: []
      responses:
        '200':
          description: My review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Reviews]
      summary: Update my review (while PENDING only)
      operationId: updateMyReview
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewRequest'
      responses:
        '200':
          description: Review updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /reviews/moderation:
    get:
      tags: [Reviews]
      summary: List pending reviews for moderation (admin)
      operationId: listModerationQueue
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Pending review list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationReviewListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reviews/{reviewId}/publish:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    post:
      tags: [Reviews]
      summary: Publish a review (admin)
      operationId: publishReview
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Review published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /reviews/{reviewId}/reject:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    post:
      tags: [Reviews]
      summary: Reject a review (admin)
      operationId: rejectReview
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectReviewRequest'
      responses:
        '200':
          description: Review rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ══════════════════════════════════════════════════════════════════════════
  # Coupons
  # ══════════════════════════════════════════════════════════════════════════

  /coupons:
    get:
      tags: [Coupons]
      summary: List coupons for a store (admin)
      operationId: listCoupons
      security:
        - BearerAuth: []
      parameters:
        - name: storeId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: discountType
          in: query
          schema:
            type: string
            enum: [FLAT, PERCENT]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated coupon list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Coupons]
      summary: Create a coupon (admin)
      operationId: createCoupon
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCouponRequest'
      responses:
        '201':
          description: Coupon created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /coupons/validate:
    post:
      tags: [Coupons]
      summary: Validate a coupon code (public preview)
      operationId: validateCoupon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCouponRequest'
      responses:
        '200':
          description: Coupon validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponValidationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /coupons/{couponId}:
    parameters:
      - name: couponId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    get:
      tags: [Coupons]
      summary: Get coupon detail (admin)
      operationId: getCoupon
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Coupon detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Coupons]
      summary: Update a coupon (admin)
      operationId: updateCoupon
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCouponRequest'
      responses:
        '200':
          description: Coupon updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    # DESIGN-02 fix: replaces the former /coupons/{couponId}/deactivate RPC sub-path.
    # Accepts isActive=false to deactivate; isActive=true to reactivate in future.
    patch:
      tags: [Coupons]
      summary: Update coupon active status (admin)
      operationId: updateCouponStatus
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponUpdateStatusRequest'
      responses:
        '200':
          description: Coupon status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ══════════════════════════════════════════════════════════════════════════
  # Recommendations
  # ══════════════════════════════════════════════════════════════════════════

  /recommendations/home:
    get:
      tags: [Recommendations]
      summary: Get home-page recommendation sections
      operationId: getHomeRecommendations
      security:
        - BearerAuth: []
        - GuestToken: []
      responses:
        '200':
          description: Home recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeRecommendationsResponse'

  /recommendations/books/{bookId}/related:
    parameters:
      - name: bookId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    get:
      tags: [Recommendations]
      summary: Get related reads for a book (cross-sell)
      operationId: getRelatedBooks
      parameters:
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
      responses:
        '200':
          description: Related books
          content:
            application/json:
              schema:
                type: object
                required: [bookId, relatedBooks]
                properties:
                  bookId:
                    $ref: '#/components/schemas/UUID'
                  relatedBooks:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookSummaryDTO'
        '404':
          $ref: '#/components/responses/NotFound'

  /recommendations/me:
    get:
      tags: [Recommendations]
      summary: Get personalised recommendations for the authenticated member
      operationId: getPersonalisedRecommendations
      security:
        - BearerAuth: []
      parameters:
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: reason
          in: query
          schema:
            type: string
            enum: [ORDER_HISTORY, CATEGORY_AFFINITY, AUTHOR_FOLLOW]
      responses:
        '200':
          description: Personalised recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalisedRecommendationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /recommendations/bestsellers:
    get:
      tags: [Recommendations]
      summary: Get bestseller list
      operationId: getBestsellers
      parameters:
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: categorySlug
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Bestseller books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSummaryDTO'

  /recommendations/new-launches:
    get:
      tags: [Recommendations]
      summary: Get new launch titles
      operationId: getNewLaunches
      parameters:
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: categorySlug
          in: query
          schema:
            type: string
      responses:
        '200':
          description: New launch books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSummaryDTO'
